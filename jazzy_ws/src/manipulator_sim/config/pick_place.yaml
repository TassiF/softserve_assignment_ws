isaac_joint_trajectory_controller:
  ros__parameters:
    state_topic: /isaac_joint_states
    command_topic: /isaac_joint_commands
    action_name: /isaac_joint_trajectory_controller/follow_joint_trajectory
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    control_rate_hz: 100.0
    state_timeout: 1.0
    path_tolerance: 0.5
    goal_tolerance: 0.02
    goal_time_tolerance: 3.0
    stable_samples: 5

random_pick_place_planner:
  ros__parameters:
    planning_group: ur_manipulator
    end_effector_link: tool0
    planner_id: RRTConnectkConfigDefault
    planning_time: 5.0
    planning_attempts: 5
    random_samples: 10
    velocity_scaling: 0.25
    acceleration_scaling: 0.25
    position_tolerance: 0.01
    orientation_tolerance: 0.05
    approach_height: 0.15
    dwell_time: 1.0
    retry_delay: 2.0
    # 0 means that new random pick/place cycles are generated indefinitely.
    max_cycles: 0
    # Set to a non-negative value for repeatable random targets.
    random_seed: -1
    joint_state_topic: /joint_states
    joint_state_timeout: 1.0
    minimum_state_samples: 3
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    # Cartesian sampling boxes in the robot's planning frame (base_link).
    # Pick and place use opposite sides of the workspace by default.
    pick_min: [0.35, -0.70, 0.20]
    pick_max: [0.95, -0.15, 0.65]
    place_min: [0.35, 0.15, 0.20]
    place_max: [0.95, 0.70, 0.65]
