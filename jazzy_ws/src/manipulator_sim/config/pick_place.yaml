isaac_joint_trajectory_controller:
  ros__parameters:
    state_topic: /isaac_joint_states
    command_topic: /isaac_joint_commands
    action_name: /isaac_joint_trajectory_controller/follow_joint_trajectory
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    control_rate_hz: 100.0
    state_timeout: 1.0
    path_tolerance: 0.5
    goal_tolerance: 0.02
    goal_time_tolerance: 3.0
    stable_samples: 5

random_pick_place_planner:
  ros__parameters:
    planning_group: ur_manipulator
    # MoveIt targets the TCP at the center of the gripper finger tips.
    end_effector_link: gripper_tcp
    gripper_mount_link: wrist_3_link
    # Empty selects OMPL's configured/default planner (RRTConnect here).
    planner_id: ''
    planning_time: 8.0
    planning_attempts: 8
    planning_retries: 4
    velocity_scaling: 0.20
    acceleration_scaling: 0.20
    position_tolerance: 0.01
    orientation_tolerance: 0.05
    approach_height: 0.18
    cartesian_step: 0.005
    dwell_time: 1.0
    retry_delay: 2.0
    scene_timeout: 8.0
    placement_timeout: 4.0
    # max_cycles and random_seed are supplied by launch arguments so their
    # command-line values cannot be masked by this parameter file.
    joint_state_topic: /joint_states
    joint_state_timeout: 1.0
    minimum_state_samples: 3
    joint_names:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    # The fixed grasp orientation is [x, y, z, w]. It points the 2F-140 down.
    grasp_orientation_xyzw: [0.70710678, 0.70710678, 0.0, 0.0]
    # Offset from the object center to gripper_tcp, expressed after applying
    # grasp_orientation_xyzw.
    object_to_tcp_offset: [0.0, 0.0, 0.0]
    # The physical gripper TCP is at the center of the finger tips.
    tcp_offset_from_wrist: [0.0, 0.0, 0.22]

    # Isaac owns the object's randomized pose and publishes the measured pose.
    object_id: pick_object
    object_size: [0.055, 0.055, 0.055]
    object_mass: 0.08
    object_spawn_min: [0.38, -0.58, 0.035]
    object_spawn_max: [0.76, -0.25, 0.035]
    object_pose_topic: /pick_place/object_pose
    object_generation_topic: /pick_place/object_generation
    reset_object_topic: /pick_place/reset_object

    # Three open-top bins. Centers contain x, y, and the base z coordinate.
    bin_centers: [
      0.36, 0.48, 0.0,
      0.64, 0.48, 0.0,
      0.92, 0.48, 0.0
    ]
    bin_outer_size: [0.22, 0.20, 0.14]
    bin_wall_thickness: 0.015
    bin_floor_thickness: 0.02
    bin_drop_height: 0.22

    # This obstacle is present in both Isaac and the MoveIt planning scene.
    obstacle_position: [0.62, 0.05, 0.25]
    obstacle_size: [0.22, 0.16, 0.50]
    ground_size: [2.4, 2.4, 0.05]

    # Conservative collision proxy attached to wrist_3_link in MoveIt.
    gripper_body_size: [0.14, 0.14, 0.18]
    gripper_body_position: [0.0, 0.0, 0.10]
    # Keep the collision proxy above the ground when the TCP is at the object
    # center; the Isaac asset remains responsible for the actual finger shape.
    gripper_finger_size: [0.025, 0.035, 0.07]
    gripper_finger_positions: [-0.070, 0.0, 0.185, 0.070, 0.0, 0.185]
    # The proxy may overlap the wrist chain at its mount. Environment
    # collisions remain enabled, including collisions with the obstacle/bins.
    gripper_touch_links:
      - base_link
      - base_link_inertia
      - shoulder_link
      - upper_arm_link
      - forearm_link
      - wrist_1_link
      - wrist_2_link
      - wrist_3_link
      - flange
      - tool0

    # Isaac gripper control and deterministic grasp confirmation.
    gripper_open_position: 0.0
    gripper_closed_position: 0.65
    max_grasp_distance: 0.035
    gripper_command_topic: /pick_place/gripper_close
    grasp_state_topic: /pick_place/grasp_attached
